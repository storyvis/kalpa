[workspace]
resolver = "2"
members = [
    "crates/libgen",
    "crates/cli",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["shaswot16"]
repository = "https://github.com/storyvis/kalpa"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.13", features = ["json", "rustls", "multipart", "form", "query"], default-features = false }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenAPI / Progenitor
progenitor = { version = "0.15", default-features = false }
progenitor-client = "0.15"

# Config
toml = "1"
dirs = "6"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"
indicatif = "0.18"
dialoguer = "0.12"

# Internal crates
kalpa-core = { path = "crates/core" }
kalpa-libgen = { path = "crates/libgen" }
